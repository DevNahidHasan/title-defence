<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <filter id="erdShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="erdHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="feignArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="fkArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect x="25" y="20" width="1050" height="50" rx="8" fill="url(#erdHead)"/>
  <text x="45" y="51" fill="#ffffff" font-size="16" font-weight="700">NIRAPOD PARKING — DATABASE-PER-SERVICE ISOLATED SCHEMA (ERD)</text>

  <!-- DATABASE 1: user_db -->
  <rect x="25" y="85" width="410" height="410" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.8" filter="url(#erdShadow)"/>
  <rect x="25" y="85" width="410" height="34" rx="8" fill="#e0f2fe"/>
  <text x="40" y="107" fill="#0369a1" font-size="12" font-weight="700">🗄️ user_db (Owned exclusively by user-service)</text>

  <!-- Table: users -->
  <rect x="40" y="130" width="380" height="150" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="40" y="130" width="380" height="26" rx="6" fill="#0284c7"/>
  <text x="50" y="148" fill="#ffffff" font-size="11" font-weight="700">TABLE: users (Unified Driver / Host Profile)</text>
  <text x="50" y="172" fill="#0f172a" font-size="10" font-weight="700">id : BIGINT [PK]</text>
  <text x="50" y="190" fill="#0f172a" font-size="10">keycloak_id : VARCHAR [UK] (sub claim from JWT)</text>
  <text x="50" y="208" fill="#0f172a" font-size="10">full_name, email [UK], phone_number : VARCHAR</text>
  <text x="50" y="226" fill="#0f172a" font-size="10">vehicle_plate : VARCHAR (e.g. Dhaka Metro-Ga 12-3456)</text>
  <text x="50" y="244" fill="#059669" font-size="10" font-weight="700">is_verified_host : BOOLEAN (true after Admin KYC)</text>
  <text x="50" y="262" fill="#64748b" font-size="9.5">created_at : TIMESTAMP</text>

  <!-- Line users -> host_kyc inside user_db -->
  <line x1="230" y1="280" x2="230" y2="305" stroke="#0284c7" stroke-width="1.8" marker-end="url(#fkArrow)"/>
  <text x="238" y="296" fill="#0284c7" font-size="9" font-weight="600">1 : 1 FK</text>

  <!-- Table: host_kyc -->
  <rect x="40" y="305" width="380" height="175" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="40" y="305" width="380" height="26" rx="6" fill="#0369a1"/>
  <text x="50" y="323" fill="#ffffff" font-size="11" font-weight="700">TABLE: host_kyc (Uber/Pathao Verification)</text>
  <text x="50" y="347" fill="#0f172a" font-size="10" font-weight="700">id : BIGINT [PK]</text>
  <text x="50" y="365" fill="#0284c7" font-size="10" font-weight="700">user_id : BIGINT [FK -> users.id]</text>
  <text x="50" y="383" fill="#0f172a" font-size="10">nid_number, nid_photo_url : VARCHAR</text>
  <text x="50" y="401" fill="#0f172a" font-size="10">ownership_doc_url : VARCHAR (Holding Tax/Allotment)</text>
  <text x="50" y="419" fill="#0f172a" font-size="10">slot_photo_url : VARCHAR (Garage Pillar/Bay No)</text>
  <text x="50" y="437" fill="#d97706" font-size="10" font-weight="700">status : ENUM (PENDING, APPROVED, REJECTED)</text>
  <text x="50" y="455" fill="#64748b" font-size="9.5">admin_remarks : TEXT</text>

  <!-- DATABASE 2: parking_db -->
  <rect x="460" y="85" width="295" height="410" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.8" filter="url(#erdShadow)"/>
  <rect x="460" y="85" width="295" height="34" rx="8" fill="#dcfce7"/>
  <text x="475" y="107" fill="#166534" font-size="12" font-weight="700">🗄️ parking_db (parking-service)</text>

  <!-- Table: parking_listings -->
  <rect x="475" y="130" width="265" height="350" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="475" y="130" width="265" height="26" rx="6" fill="#059669"/>
  <text x="485" y="148" fill="#ffffff" font-size="11" font-weight="700">TABLE: parking_listings</text>
  <text x="485" y="172" fill="#0f172a" font-size="10" font-weight="700">id : BIGINT [PK]</text>
  <text x="485" y="192" fill="#d97706" font-size="10" font-weight="700">host_user_id : BIGINT [Logical ID]</text>
  <text x="485" y="210" fill="#64748b" font-size="9">(Verified via OpenFeign -> user-service)</text>
  <text x="485" y="232" fill="#0f172a" font-size="10">title : VARCHAR (Green Heritage)</text>
  <text x="485" y="252" fill="#0f172a" font-size="10">area_name : VARCHAR (Dhanmondi, etc.)</text>
  <text x="485" y="272" fill="#0f172a" font-size="10">full_address : VARCHAR (Bay A3)</text>
  <text x="485" y="294" fill="#2563eb" font-size="10" font-weight="700">latitude : DOUBLE (Browser GPS)</text>
  <text x="485" y="312" fill="#2563eb" font-size="10" font-weight="700">longitude : DOUBLE (Browser GPS)</text>
  <text x="485" y="334" fill="#0f172a" font-size="10">vehicle_type : ENUM (CAR, BIKE)</text>
  <text x="485" y="354" fill="#0f172a" font-size="10">hourly_rate : DECIMAL (e.g. 50.00)</text>
  <text x="485" y="374" fill="#0f172a" font-size="10">available_from, until : TIME</text>
  <text x="485" y="394" fill="#0f172a" font-size="10">has_cctv, has_guard : BOOLEAN</text>
  <text x="485" y="414" fill="#059669" font-size="10" font-weight="700">status : ENUM (ACTIVE, OCCUPIED)</text>

  <!-- DATABASE 3: booking_db -->
  <rect x="780" y="85" width="295" height="410" rx="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.8" filter="url(#erdShadow)"/>
  <rect x="780" y="85" width="295" height="34" rx="8" fill="#f3e8ff"/>
  <text x="795" y="107" fill="#6b21a8" font-size="12" font-weight="700">🗄️ booking_db (booking-service)</text>

  <!-- Table: bookings -->
  <rect x="795" y="130" width="265" height="350" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="795" y="130" width="265" height="26" rx="6" fill="#7c3aed"/>
  <text x="805" y="148" fill="#ffffff" font-size="11" font-weight="700">TABLE: bookings</text>
  <text x="805" y="172" fill="#0f172a" font-size="10" font-weight="700">id : BIGINT [PK]</text>
  <text x="805" y="194" fill="#d97706" font-size="10" font-weight="700">listing_id : BIGINT [Logical ID]</text>
  <text x="805" y="210" fill="#64748b" font-size="9">(Verified via OpenFeign -> parking-service)</text>
  <text x="805" y="232" fill="#d97706" font-size="10" font-weight="700">host_user_id : BIGINT [Logical ID]</text>
  <text x="805" y="248" fill="#64748b" font-size="9">(For fast Host earnings SUM)</text>
  <text x="805" y="270" fill="#d97706" font-size="10" font-weight="700">driver_user_id : BIGINT [Logical ID]</text>
  <text x="805" y="292" fill="#0f172a" font-size="10" font-weight="700">driver_vehicle_plate : VARCHAR</text>
  <text x="805" y="310" fill="#64748b" font-size="9">(For Building Guard Pass)</text>
  <text x="805" y="332" fill="#0f172a" font-size="10">start_time, end_time : DATETIME</text>
  <text x="805" y="352" fill="#0f172a" font-size="10">total_amount : DECIMAL (Hours × Rate)</text>
  <text x="805" y="372" fill="#7c3aed" font-size="10" font-weight="700">status : ENUM (CONFIRMED, ...)</text>
  <text x="805" y="392" fill="#64748b" font-size="9.5">created_at : TIMESTAMP</text>

  <!-- Cross-DB Logical Relationships Note -->
  <rect x="25" y="475" width="1050" height="28" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="40" y="493" fill="#92400e" font-size="10.5" font-weight="600">⚡ Database-per-Service Rule: No cross-database SQL Foreign Keys. Cross-service references (Orange) are validated via OpenFeign REST clients.</text>
</svg>