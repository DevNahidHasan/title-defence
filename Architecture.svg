<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="25" y="20" width="950" height="60" rx="8" fill="url(#headerGrad)"/>
  <text x="50" y="48" fill="#ffffff" font-size="18" font-weight="700">NIRAPOD PARKING — DISTRIBUTED MICROSERVICES ARCHITECTURE</text>
  <text x="50" y="66" fill="#93c5fd" font-size="12">Database-per-Service Pattern + Keycloak OAuth2 Identity + Spring Cloud Gateway</text>

  <!-- LAYER 1: CLIENT LAYER -->
  <rect x="25" y="100" width="950" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="45" y="122" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.5">CLIENT LAYER (ANGULAR 17+ PWA)</text>

  <!-- Driver Card -->
  <rect x="45" y="132" width="280" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="60" y="152" fill="#0f172a" font-size="12" font-weight="700">🚗 Driver View</text>
  <text x="60" y="168" fill="#64748b" font-size="10">Card Feed + Split Clustered Map + Nav</text>

  <!-- Host Card -->
  <rect x="360" y="132" width="280" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="375" y="152" fill="#0f172a" font-size="12" font-weight="700">🏠 Host View</text>
  <text x="375" y="168" fill="#64748b" font-size="10">"Become a Host" KYC + Listings + Stats</text>

  <!-- Admin Card -->
  <rect x="675" y="132" width="280" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="690" y="152" fill="#0f172a" font-size="12" font-weight="700">⚙️ Admin Portal</text>
  <text x="690" y="168" fill="#64748b" font-size="10">1-Click KYC Approval + Summary Cards</text>

  <!-- Arrow Client -> Infra -->
  <line x1="500" y1="190" x2="500" y2="216" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="208" fill="#2563eb" font-size="10" font-weight="600">OAuth2 Bearer JWT</text>

  <!-- LAYER 2: IDENTITY & GATEWAY LAYER -->
  <rect x="25" y="220" width="950" height="100" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="45" y="242" fill="#1e40af" font-size="11" font-weight="700" letter-spacing="0.5">SECURITY &amp; ROUTING INFRASTRUCTURE</text>

  <!-- Keycloak -->
  <rect x="45" y="252" width="280" height="54" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="272" fill="#1e3a8a" font-size="12" font-weight="700">🔐 Keycloak Server (OAuth2 / OIDC)</text>
  <text x="60" y="288" fill="#64748b" font-size="10">Login, Registration, JWT Issuing &amp; Roles</text>
  <text x="60" y="300" fill="#059669" font-size="9" font-weight="600">Managed DB: keycloak_db</text>

  <!-- Spring Cloud Gateway -->
  <rect x="360" y="252" width="280" height="54" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="375" y="274" fill="#1e3a8a" font-size="12" font-weight="700">🌐 api-gateway</text>
  <text x="375" y="292" fill="#64748b" font-size="10">Spring Cloud Gateway (JWT Token Relay)</text>

  <!-- Eureka Server -->
  <rect x="675" y="252" width="280" height="54" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="690" y="274" fill="#1e3a8a" font-size="12" font-weight="700">🧭 discovery-service</text>
  <text x="690" y="292" fill="#64748b" font-size="10">Netflix Eureka (Service Registration)</text>

  <!-- Arrow Gateway -> Microservices -->
  <line x1="500" y1="320" x2="500" y2="346" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="338" fill="#2563eb" font-size="10" font-weight="600">Routed REST Requests</text>

  <!-- LAYER 3: CORE MICROSERVICES -->
  <rect x="25" y="350" width="950" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="45" y="372" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.5">CORE BUSINESS MICROSERVICES (SPRING BOOT 3 + OPENFEIGN)</text>

  <!-- user-service -->
  <rect x="45" y="382" width="280" height="82" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="60" y="404" fill="#0f172a" font-size="13" font-weight="700">👤 1. user-service</text>
  <text x="60" y="422" fill="#475569" font-size="10.5">• User Profile &amp; Vehicle Plate</text>
  <text x="60" y="438" fill="#475569" font-size="10.5">• "Become a Host" Online KYC</text>
  <text x="60" y="454" fill="#475569" font-size="10.5">• Admin 1-Click KYC Approval</text>

  <!-- parking-service -->
  <rect x="360" y="382" width="280" height="82" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="375" y="404" fill="#0f172a" font-size="13" font-weight="700">🅿️ 2. parking-service</text>
  <text x="375" y="422" fill="#475569" font-size="10.5">• Garage Listing Management</text>
  <text x="375" y="438" fill="#475569" font-size="10.5">• 1-Click Browser GPS Capture</text>
  <text x="375" y="454" fill="#475569" font-size="10.5">• Area Search &amp; Haversine Radius</text>

  <!-- booking-service -->
  <rect x="675" y="382" width="280" height="82" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="690" y="404" fill="#0f172a" font-size="13" font-weight="700">📅 3. booking-service</text>
  <text x="690" y="422" fill="#475569" font-size="10.5">• Reservation &amp; Slot Overlap Check</text>
  <text x="690" y="438" fill="#475569" font-size="10.5">• Fare Calculation (Hours × Rate)</text>
  <text x="690" y="454" fill="#475569" font-size="10.5">• Host Earnings Stats (SUM/COUNT)</text>

  <!-- Feign Lines -->
  <path d="M 325 410 L 360 410" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M 640 410 L 675 410" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrows Microservices -> Databases -->
  <line x1="185" y1="464" x2="185" y2="502" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="464" x2="500" y2="502" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="815" y1="464" x2="815" y2="502" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- LAYER 4: DATABASE-PER-SERVICE -->
  <rect x="25" y="506" width="950" height="150" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="45" y="528" fill="#065f46" font-size="11" font-weight="700" letter-spacing="0.5">ISOLATED DATABASE-PER-SERVICE LAYER (POSTGRESQL / MYSQL)</text>

  <!-- user_db -->
  <rect x="45" y="538" width="280" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="560" fill="#065f46" font-size="13" font-weight="700">🗄️ user_db</text>
  <text x="60" y="580" fill="#0f172a" font-size="10.5" font-weight="600">Table: users</text>
  <text x="60" y="596" fill="#64748b" font-size="9.5">id, keycloak_id, phone, plate, is_verified_host</text>
  <text x="60" y="614" fill="#0f172a" font-size="10.5" font-weight="600">Table: host_kyc</text>
  <text x="60" y="630" fill="#64748b" font-size="9.5">id, user_id, nid, tax_slip_url, slot_photo, status</text>

  <!-- parking_db -->
  <rect x="360" y="538" width="280" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="375" y="560" fill="#065f46" font-size="13" font-weight="700">🗄️ parking_db</text>
  <text x="375" y="582" fill="#0f172a" font-size="10.5" font-weight="600">Table: parking_listings</text>
  <text x="375" y="602" fill="#64748b" font-size="10">id, host_user_id (Logical ID)</text>
  <text x="375" y="618" fill="#64748b" font-size="10">title, area_name, full_address</text>
  <text x="375" y="634" fill="#64748b" font-size="10">latitude, longitude, rate, vehicle_type, status</text>

  <!-- booking_db -->
  <rect x="675" y="538" width="280" height="100" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
  <text x="690" y="560" fill="#065f46" font-size="13" font-weight="700">🗄️ booking_db</text>
  <text x="690" y="582" fill="#0f172a" font-size="10.5" font-weight="600">Table: bookings</text>
  <text x="690" y="602" fill="#64748b" font-size="10">id, listing_id (Logical ID), host_user_id</text>
  <text x="690" y="618" fill="#64748b" font-size="10">driver_user_id, driver_vehicle_plate</text>
  <text x="690" y="634" fill="#64748b" font-size="10">start_time, end_time, total_amount, status</text>
</svg>